name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Версии инструментов
        run: |
          flutter --version
          java -version

      - run: flutter pub get

      - name: Analyze (видно реальные ошибки в логе)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ВАЖНО: android/ генерируется шаблоном Flutter. Шаблон НЕ должен
      # трогать pubspec.yaml (зависимости + version) — иначе сборка падает
      # на «Target of URI doesn't exist: package:dio/...», а релиз уходит
      # с тегом v1.0.0+1. Поэтому pubspec сохраняем и возвращаем на место.
      - name: Создать android-проект (pubspec защищён)
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --platforms=android .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          grep -n '^version:' pubspec.yaml

      - run: flutter pub get

      - name: Set Android SDK levels
        run: |
          # Плагины (image_picker, share_plus, path_provider) требуют compileSdk 35+.
          # AGP 8.7 официально тестируется до compileSdk 35 — берём 35, а не 36:
          # так Gradle не ищет платформу android-36, которой может не быть на раннере.
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          # Платформа android-35 может отсутствовать на раннере — ставим сами,
          # иначе Gradle падает на «Failed to install ... android-35».
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
            "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          grep -nE 'compileSdk|minSdk|targetSdk' android/app/build.gradle

      - name: Modernize Android toolchain (AGP + Gradle)
        run: |
          # compileSdk 35 требует AGP 8.6+ и Gradle 8.7+.
          # ВАЖНО: AGP 8.7+ несовместим с gradle-плагином Flutter 3.24 — сборка
          # падала на конфигурации проекта. Берём МИНИМУМ под compileSdk 35:
          # AGP 8.6.0 + Gradle 8.7 (ближе всего к диапазону Flutter 3.24).
          sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.6.0"|' android/settings.gradle
          sed -i 's|gradle-.*-all.zip|gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          grep -nE 'com.android.application|distributionUrl' android/settings.gradle android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Kotlin version
        run: |
          cd android
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*"|id "org.jetbrains.kotlin.android" version "1.9.24"|' settings.gradle
          sed -i "s|ext.kotlin_version = .*|ext.kotlin_version = '1.9.24'|" build.gradle
          cd ..

      - name: Set app name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Замерщик окон Almas"|' android/app/src/main/AndroidManifest.xml

      - name: Add permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application|' android/app/src/main/AndroidManifest.xml

      # Подпись НЕ должна ронять сборку: если секрет не задан — собираем
      # debug-ключом (APK всё равно ставится и обновляется).
      - name: Decode keystore (если задан)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            echo "keystore=yes" >> $GITHUB_ENV
            echo "Keystore получен"
          else
            echo "keystore=no" >> $GITHUB_ENV
            echo "Секрет KEYSTORE_BASE64 не задан — подпишем debug-ключом"
          fi

      - name: Create key.properties
        if: env.keystore == 'yes'
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Configure signing
        if: env.keystore == 'yes'
        run: |
          cd android/app
          sed -i 's|^android {|def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {|' build.gradle
          sed -i 's|    buildTypes {|    signingConfigs {\n        release {\n            keyAlias = keystoreProperties["keyAlias"]\n            keyPassword = keystoreProperties["keyPassword"]\n            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n            storePassword = keystoreProperties["storePassword"]\n        }\n    }\n    buildTypes {|' build.gradle
          sed -i 's|signingConfig = signingConfigs.debug|signingConfig = signingConfigs.release|' build.gradle
          cd ../..

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Показать ошибки сборки
        if: failure()
        run: |
          echo "=== ОШИБКИ СБОРКИ ==="
          grep -nE "error:|Error:|FAILURE|What went wrong|Execution failed|Exception|Could not|not found|requires|не найден" build.log | tail -n 80 || true
          echo "=== ХВОСТ ЛОГА ==="
          tail -n 80 build.log || true

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove old release/tag (если тег уже есть)
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
