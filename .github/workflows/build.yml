name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Analyze (видно реальные ошибки в логе)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - run: flutter create --platforms=android .

      - name: Set Android SDK levels
        run: |
          # Плагины (image_picker, share_plus, path_provider, package_info_plus)
          # требуют compileSdk 34. AGP из шаблона Flutter 3.24 (8.1.0) его
          # поддерживает — апгрейд AGP/Gradle НЕ нужен.
          # Раньше здесь стоял compileSdk 36: он тянул AGP 8.7 + Gradle 8.9
          # и ломал встроенный Gradle-плагин Flutter (javawriter / asm).
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle
          grep -nE 'compileSdk|minSdk|targetSdk' android/app/build.gradle
          echo "--- AGP / Gradle (должны быть родные, из шаблона Flutter) ---"
          grep -nE 'com.android.application|distributionUrl' android/settings.gradle android/gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle.properties (aapt2 / android-35.jar) ---"
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          cat android/gradle.properties

      - name: Fix Kotlin version
        run: |
          # Шаблон flutter create ставит Kotlin 1.7.x, а плагины
          # (shared_preferences_android 2.4.7, share_plus, path_provider)
          # собраны на Kotlin 1.9.x -> ':shared_preferences_android:compileReleaseKotlin'
          # падал с "binary 1.9.0, expected 1.7.1". Поднимаем только Kotlin.
          # Схема plugins {} (Flutter 3.24)
          sed -i 's/org\.jetbrains\.kotlin\.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i "s/org\.jetbrains\.kotlin\.android' version '[^']*'/org.jetbrains.kotlin.android' version '1.9.24'/" android/settings.gradle
          # Старая схема ext.kotlin_version (на случай, если шаблон её использует)
          sed -i "s/ext\.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          sed -i 's/ext\.kotlin_version = "[^"]*"/ext.kotlin_version = "1.9.24"/' android/build.gradle
          echo "--- android/settings.gradle ---"
          cat android/settings.gradle
          echo "--- android/build.gradle ---"
          cat android/build.gradle
          # чистая сборка после смены версии Kotlin
          flutter clean

      - name: Set app name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Замерщик окон Almas"|' android/app/src/main/AndroidManifest.xml

      - name: Add permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Configure signing
        run: |
          cd android/app
          sed -i 's|^android {|def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {|' build.gradle
          sed -i 's|    buildTypes {|    signingConfigs {\n        release {\n            keyAlias = keystoreProperties["keyAlias"]\n            keyPassword = keystoreProperties["keyPassword"]\n            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n            storePassword = keystoreProperties["storePassword"]\n        }\n    }\n    buildTypes {|' build.gradle
          sed -i 's|signingConfig = signingConfigs.debug|signingConfig = signingConfigs.release|' build.gradle
          cd ../..

      - name: Build APK
        run: flutter build apk --release

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove old release/tag (если тег уже есть)
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
