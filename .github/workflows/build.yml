name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
      - name: Analyze (видно реальные ошибки в логе)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter create --platforms=android .
      - name: Set Android SDK levels
        run: |
          # Плагины (image_picker, share_plus, path_provider) требуют compileSdk 35+.
          # Без этого Gradle падает: "requires a higher Android SDK version".
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          grep -nE 'compileSdk|minSdk|targetSdk' android/app/build.gradle
      - name: Modernize Android toolchain (AGP + Gradle)
        run: |
          # compileSdk 36 требует AGP 8.6+ и Gradle 8.7+.
          sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.7.0"|' android/settings.gradle
          sed -i 's|gradle-.*-all.zip|gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          grep -nE 'com.android.application|distributionUrl' android/settings.gradle android/gradle/wrapper/gradle-wrapper.properties
      - name: Fix Kotlin version
        run: |
          cd android
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*"|id "org.jetbrains.kotlin.android" version "1.9.24"|' settings.gradle
          sed -i "s|ext.kotlin_version = .*|ext.kotlin_version = '1.9.24'|" build.gradle
          cd ..
      - name: Set app name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Замерщик окон Almas"|' android/app/src/main/AndroidManifest.xml
      - name: Add permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
      - name: Configure signing
        run: |
          cd android/app
          sed -i 's|^android {|def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {|' build.gradle
          sed -i 's|    buildTypes {|    signingConfigs {\n        release {\n            keyAlias = keystoreProperties["keyAlias"]\n            keyPassword = keystoreProperties["keyPassword"]\n            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n            storePassword = keystoreProperties["storePassword"]\n        }\n    }\n    buildTypes {|' build.gradle
          sed -i 's|signingConfig = signingConfigs.debug|signingConfig = signingConfigs.release|' build.gradle
          cd ../..
      - name: Harden Gradle against Maven flakiness
        run: |
          # Причина падения прогона 45992354859:
          #   Could not find com.squareup:javawriter:2.5.0 / org.ow2.asm:asm:9.1
          #   Required by project :gradle > com.android.tools.build:gradle:7.3.0
          # Это НЕ ошибка кода: оба артефакта есть в Maven Central. Gradle
          # словил 404/таймаут, записал «не найдено» в кэш и повторы падали
          # за 1 секунду (955 мс, 943 мс) — то есть в сеть уже не ходил.
          # Лечим: длинные таймауты, повторы HTTP и отказ от демона — он
          # держит негативный кэш в памяти и переживает чистку папок.
          echo "org.gradle.daemon=false" >> android/gradle.properties
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          def MIRRORS = ['https://repo1.maven.org/maven2',
                         'https://dl.google.com/dl/android/maven2',
                         'https://plugins.gradle.org/m2']
          gradle.projectsLoaded {
              gradle.rootProject.allprojects { p ->
                  p.buildscript.repositories { MIRRORS.each { u -> maven { url u } } }
                  p.repositories { MIRRORS.each { u -> maven { url u } } }
              }
          }
          gradle.settingsEvaluated { s ->
              s.pluginManagement.repositories { MIRRORS.each { u -> maven { url u } } }
          }
          EOF
      - name: Build APK (3 попытки — репозитории Maven иногда отдают 404)
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=180000
            -Dorg.gradle.internal.http.socketTimeout=180000
            -Dorg.gradle.internal.repository.max.tentatives=6
            -Dorg.gradle.internal.repository.initial.backoff=3000
            -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "=== ПОПЫТКА СБОРКИ $i ИЗ 3 ==="
            if flutter build apk --release 2>&1 | tee /tmp/build_$i.log; then
              echo "СБОРКА УСПЕШНА (попытка $i)"
              exit 0
            fi
            echo "Попытка $i не удалась — глушу демон и сношу кэш Gradle целиком"
            pkill -f GradleDaemon || true
            rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/.tmp android/.gradle build
            sleep 45
          done
          echo "СБОРКА НЕ УДАЛАСЬ ПОСЛЕ 3 ПОПЫТОК"
          exit 1
      - name: Save error log (только при падении)
        if: failure()
        run: |
          {
            echo "# Ошибка сборки window_calc"
            echo ""
            echo "Прогон: ${{ github.run_id }}"
            echo "Дата: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            cat /tmp/build_*.log 2>/dev/null | tail -n 400 || echo "лог не найден"
            echo '```'
          } > BUILD_ERROR.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BUILD_ERROR.md
          git commit -m "build error log [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true
      - name: Clear error log (сборка прошла)
        if: success()
        run: |
          if [ -f BUILD_ERROR.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -f BUILD_ERROR.md
            git commit -m "clear build error log [skip ci]" || true
            git pull --rebase --autostash || true
            git push || true
          fi
      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Remove old release/tag (если тег уже есть)
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
